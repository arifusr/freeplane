name: Release fmap CLI (Rust)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Compiler & System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake libssl-dev libatomic1
          g++ --version

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fmap-rs -> target"

      - name: Build Standalone Release Binary
        run: |
          cd fmap-rs
          cargo build --release
          strip target/release/fmap

      - name: Smoke Test
        run: |
          ./fmap-rs/target/release/fmap --version
          ./fmap-rs/target/release/fmap --help

      - name: Package Release Assets
        run: |
          cd fmap-rs/target/release
          tar -czf fmap-linux-x86_64.tar.gz fmap
          sha256sum fmap-linux-x86_64.tar.gz > fmap-linux-x86_64.tar.gz.sha256
          ls -lh fmap-linux-x86_64.tar.gz

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fmap-rs/target/release/fmap-linux-x86_64.tar.gz
            fmap-rs/target/release/fmap-linux-x86_64.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
