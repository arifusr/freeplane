[package]
name = "fmap"
version = "1.3.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
ratatui = "0.29"
crossterm = "0.28"
lbug = "0.22"
anyhow = "1.0"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

